name: Update NFL playoff scores
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'
permissions:
  contents: write
concurrency:
  group: xml-sync
  cancel-in-progress: false
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      -uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_scores.py
      - name: Publish scores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scores.xml
          git diff --cached --quiet || (git commit -m 'Update NFL playoff scores' && git push)
